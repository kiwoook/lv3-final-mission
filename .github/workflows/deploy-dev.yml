name: Deploy to Development

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    
  deploy:
    runs-on: self-hosted
    environment: development
    needs: test
    if: ${{ needs.test.result == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build DEV application
      run: ./gradlew buildDev

    - name: Execute deployment script
      run: |
        chmod +x scripts/deploy-dev.sh
        ./scripts/deploy-dev.sh

    - name: Wait for application startup
      run: |
        echo "⏳ Waiting for dev application to start..."
        sleep 15

    - name: Health check
      run: |
        echo "🔍 Starting health check for dev environment..."
        for i in {1..12}; do
          if curl -f http://localhost:8081/actuator/health; then
            echo "✅ Dev health check passed!"
            echo "🌐 Application available at: http://localhost:8081"
            exit 0
          else
            echo "⏳ Health check attempt $i/12 failed, retrying in 5 seconds..."
            sleep 5
          fi
        done
        echo "❌ Dev health check failed after 12 attempts"
        echo "📋 Checking application logs..."
        tail -50 /opt/lv3-final-mission/dev/dev-app.log || echo "No logs available"
        exit 1

    - name: Deployment notification
      if: success()
      run: |
        echo "🎉 Development deployment completed successfully!"
        echo "📊 Environment: Development"
        echo "🌐 URL: http://localhost:8081"
        echo "🔧 Profile: dev"
        echo "💾 Database: H2 (In-memory)"
