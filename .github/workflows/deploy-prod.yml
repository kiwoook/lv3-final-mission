name: Deploy to Production

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    
  deploy:
    runs-on: self-hosted
    environment: production
    needs: test
    if: ${{ needs.test.result == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build PROD application
      run: ./gradlew buildProd

    - name: Setup /opt directory
      run: |
        # /opt 디렉토리 생성
        sudo mkdir -p /opt/lv3-final-mission/prod
        sudo chown -R $USER:$USER /opt/lv3-final-mission

    - name: Stop existing prod application
      run: |
        sudo systemctl stop lv3-final-mission-prod || echo "Service not running or doesn't exist"
        echo "✅ Production application service stopped"

    - name: Start MySQL Database
      run: |
        echo "🗄️ Starting MySQL database..."
        docker compose down || true
        docker compose up -d
        echo "✅ MySQL container started"

    - name: Wait for MySQL to be ready
      run: |
        echo "⏳ Waiting for MySQL to be ready..."
        timeout=60
        while [ $timeout -gt 0 ] && ! docker exec lv3-final-mission-mysql mysqladmin ping -h"localhost" --silent; do
          echo "⏳ MySQL is not ready yet, waiting... ($timeout seconds left)"
          sleep 5
          timeout=$((timeout-5))
        done
        if [ $timeout -le 0 ]; then
          echo "❌ MySQL failed to start within 60 seconds"
          docker logs lv3-final-mission-mysql
          exit 1
        fi
        echo "✅ MySQL is ready!"

    - name: Deploy production application
      run: |
        cd build/libs
        JAR_FILE="lv2-final-mission-0.0.1-SNAPSHOT-prod.jar"
        if [ ! -f "$JAR_FILE" ]; then
          echo "❌ Expected JAR file not found: $JAR_FILE"
          ls -la
          exit 1
        fi
        
        # jar 파일을 /opt로 복사
        cp $JAR_FILE /opt/lv3-final-mission/prod/
        
        # systemd 서비스 파일 설치
        sudo cp $GITHUB_WORKSPACE/scripts/lv3-final-mission-prod.service /etc/systemd/system/
        sudo systemctl daemon-reload
        sudo systemctl enable lv3-final-mission-prod
        
        # 서비스 시작
        sudo systemctl start lv3-final-mission-prod
        echo "✅ Production application service started"

    - name: Wait for application startup
      run: |
        echo "⏳ Waiting for production application to start..."
        sleep 20

    - name: Health check with rollback
      run: |
        echo "🔍 Starting health check for production environment..."
        for i in {1..15}; do
          if curl -f http://localhost:8080/actuator/health; then
            echo "✅ Production health check passed!"
            echo "🌐 Application available at: http://localhost:8080"
            exit 0
          else
            echo "⏳ Health check attempt $i/15 failed, retrying in 5 seconds..."
            sleep 5
          fi
        done
        
        echo "❌ Production health check failed after 15 attempts"
        echo "📋 Checking service status and logs..."
        sudo systemctl status lv3-final-mission-prod --no-pager
        tail -50 /opt/lv3-final-mission/prod/prod-app.log || echo "No logs available"
        exit 1

    - name: Deployment notification
      if: success()
      run: |
        echo "🎉 Production deployment completed successfully!"
        echo "📊 Environment: Production" 
        echo "🌐 URL: http://localhost:8080"
        echo "🔧 Profile: prod"
        echo "🗄️ Database: MySQL"
        echo "⚡ Status: Live"

