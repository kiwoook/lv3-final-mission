name: Deploy to Production

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    
  deploy:
    runs-on: self-hosted
    environment: production
    needs: test
    if: ${{ needs.test.result == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build PROD application
      run: ./gradlew buildProd

    - name: Execute deployment script
      run: |
        chmod +x scripts/deploy-prod.sh
        ./scripts/deploy-prod.sh

    - name: Wait for application startup
      run: |
        echo "⏳ Waiting for production application to start..."
        sleep 20

    - name: Health check with rollback
      run: |
        echo "🔍 Starting health check for production environment..."
        for i in {1..15}; do
          if curl -f http://localhost:8080/actuator/health; then
            echo "✅ Production health check passed!"
            echo "🌐 Application available at: http://localhost:8080"
            exit 0
          else
            echo "⏳ Health check attempt $i/15 failed, retrying in 5 seconds..."
            sleep 5
          fi
        done
        
        echo "❌ Production health check failed after 15 attempts"
        echo "📋 Checking application logs..."
        tail -50 /opt/lv3-final-mission/prod/prod-app.log || echo "No logs available"
        exit 1

    - name: Deployment notification
      if: success()
      run: |
        echo "🎉 Production deployment completed successfully!"
        echo "📊 Environment: Production" 
        echo "🌐 URL: http://localhost:8080"
        echo "🔧 Profile: prod"
        echo "🗄️ Database: MySQL"
        echo "⚡ Status: Live"

